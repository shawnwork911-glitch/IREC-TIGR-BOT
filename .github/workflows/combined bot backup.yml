name: Combined Bot — Backup (7 AM MYT)
on:
  schedule:
    - cron: '0 23 * * 1,3'   # 7 AM MYT Tue & Thu
  workflow_dispatch:

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check if primary workflow ran successfully today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the last run of the primary workflow
          LAST_STATUS=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/combined_bot.yml/runs?per_page=1" \
            --jq '.workflow_runs[0] | "\(.conclusion) \(.created_at)"')

          echo "Last primary run: $LAST_STATUS"
          CONCLUSION=$(echo "$LAST_STATUS" | awk '{print $1}')
          RUN_DATE=$(echo "$LAST_STATUS" | awk '{print $2}' | cut -c1-10)
          TODAY=$(date -u +%Y-%m-%d)

          if [[ "$RUN_DATE" == "$TODAY" || "$RUN_DATE" == "$(date -u -d 'yesterday' +%Y-%m-%d)" ]] && [[ "$CONCLUSION" == "success" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Primary ran successfully — skipping backup."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Primary did not succeed — backup will run."
          fi

      - name: Checkout repository
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          pip install --upgrade pip
          pip install playwright python-dotenv openpyxl pandas msal requests

      - name: Install Playwright browsers
        if: steps.check.outputs.skip == 'false'
        run: python -m playwright install chromium --with-deps

      - name: Create working directories
        if: steps.check.outputs.skip == 'false'
        run: mkdir -p downloads logs screenshots output

      - name: Write .env from secrets
        if: steps.check.outputs.skip == 'false'
        run: |
          cat > .env << 'EOF'
          IREC_EMAIL=${{ secrets.IREC_EMAIL }}
          IREC_PASSWORD=${{ secrets.IREC_PASSWORD }}
          TIGR_MYUSERNAME=${{ secrets.TIGR_MYUSERNAME }}
          TIGR_MYPASSWORD=${{ secrets.TIGR_MYPASSWORD }}
          TIGR_SGUSERNAME=${{ secrets.TIGR_SGUSERNAME }}
          TIGR_SGPASSWORD=${{ secrets.TIGR_SGPASSWORD }}
          HEADLESS=true
          EOF

      - name: Run combined_bot.py
        if: steps.check.outputs.skip == 'false'
        run: python combined_bot_ci.py

      - name: Upload output to SharePoint (via Power Automate)
        if: steps.check.outputs.skip == 'false'
        env:
          POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
        run: python upload_to_powerautomate.py

      - name: Upload output to GitHub artifacts (backup)
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: combined-output-backup-${{ github.run_number }}
          path: |
            output/combined_output.xlsx
            logs/
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-backup-${{ github.run_number }}
          path: screenshots/
          retention-days: 7