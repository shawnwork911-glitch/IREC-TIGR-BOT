name: Combined Bot — IREC + TIGR

# ── Schedule: runs every Monday at 9:00 AM Malaysia time (UTC+8 = 01:00 UTC) ──
on:
  schedule:
    - cron: '0 1 */2 * *'    # every 2 days    9AM MYT
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 24 fix

    steps:

      # ── 1. Check out your repo ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install Python dependencies ──────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install playwright python-dotenv openpyxl pandas msal requests

      # ── 4. Install Playwright Chromium browser ───────────────────────────────
      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      # ── 5. Create working directories ───────────────────────────────────────
      - name: Create working directories
        run: mkdir -p downloads logs screenshots output

      # ── 6. Write credentials from GitHub Secrets into .env ──────────────────
      - name: Write .env from secrets
        run: |
          cat > .env << 'EOF'
          IREC_EMAIL=${{ secrets.IREC_EMAIL }}
          IREC_PASSWORD=${{ secrets.IREC_PASSWORD }}
          TIGR_MYUSERNAME=${{ secrets.TIGR_MYUSERNAME }}
          TIGR_MYPASSWORD=${{ secrets.TIGR_MYPASSWORD }}
          TIGR_SGUSERNAME=${{ secrets.TIGR_SGUSERNAME }}
          TIGR_SGPASSWORD=${{ secrets.TIGR_SGPASSWORD }}
          HEADLESS=true
          EOF

      # ── 7. Run the bot ───────────────────────────────────────────────────────
      - name: Run combined_bot.py
        run: python combined_bot_ci.py

      # ── 8. Upload Excel to SharePoint via Power Automate ────────────────────
      - name: Upload output to SharePoint (via Power Automate)
        if: always()
        env:
          POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
        run: python upload_to_powerautomate.py

      # ── 9. Keep a backup copy in GitHub artifacts (30 days) ─────────────────
      - name: Upload output to GitHub artifacts (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-output-${{ github.run_number }}
          path: |
            output/combined_output.xlsx
            logs/
          retention-days: 30

      # ── 10. Upload screenshots on failure for debugging ──────────────────────
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 7
