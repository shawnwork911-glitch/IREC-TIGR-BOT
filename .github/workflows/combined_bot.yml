name: Combined Bot — IREC + TIGR
# 22:00 UTC every day = 06:00 MYT the next day (daily run)
on:
  schedule:
    - cron: '0 22 * * *'   # 06:00 MYT daily (= 22:00 UTC the day before)
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 3. Python dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install playwright python-dotenv openpyxl pandas requests

      # ── 4. Playwright browser ──────────────────────────────────────────────
      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      # ── 5. Run the bot ─────────────────────────────────────────────────────
      # Secrets are set in GitHub → Settings → Secrets → Actions
      # HEADLESS=true so Chromium runs without a display on the Linux runner
      # CI=true is set automatically by GitHub Actions — skips input() pauses
      - name: Run combined bot
        env:
          HEADLESS: "true"
          IREC_EMAIL:       ${{ secrets.IREC_EMAIL }}
          IREC_PASSWORD:    ${{ secrets.IREC_PASSWORD }}
          TIGR_MYUSERNAME:  ${{ secrets.TIGR_MYUSERNAME }}
          TIGR_MYPASSWORD:  ${{ secrets.TIGR_MYPASSWORD }}
          TIGR_SGUSERNAME:  ${{ secrets.TIGR_SGUSERNAME }}
          TIGR_SGPASSWORD:  ${{ secrets.TIGR_SGPASSWORD }}
        # Run with a 30-minute safety timeout.
        # Exit code is preserved so the workflow shows red on bot failure.
        run: |
          echo "=== Bot starting ==="
          timeout 1800 python combined_bot.py
          echo "=== Bot finished ==="

      # ── 6. Upload to SharePoint via Power Automate ─────────────────────────
      # Runs only if the output file was actually created by the bot.
      # POWER_AUTOMATE_URL must be added to GitHub → Settings → Secrets → Actions.
      - name: Upload to SharePoint via Power Automate
        env:
          POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
        run: |
          if [ -f "output/combined_output.xlsx" ]; then
            echo "=== Uploading to SharePoint ==="
            python upload_to_powerautomate.py
            echo "=== Upload finished ==="
          else
            echo "[SKIP] output/combined_output.xlsx not found — skipping SharePoint upload."
          fi

      # ── 7. Upload all outputs as artifacts ────────────────────────────────
      - name: Upload combined Excel output
        if: always()
        uses: actions/upload-artifact@v4.6.2   # v4.6.2+ built for Node 24 — no deprecation warnings
        with:
          name: combined-output-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Upload downloaded source files
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: downloads-${{ github.run_number }}
          path: downloads/
          retention-days: 7

      - name: Upload screenshots (for debugging)
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 14
