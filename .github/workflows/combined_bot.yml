name: Combined Bot — IREC + TIGR
# 2 AM MYT Tue & Thu (= 21:00 UTC Mon & Wed) — primary
on:
  schedule:
    - cron: '0 18 * * 1,3'   # 2 AM MYT Tue & Thu
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4   # Node.js 24 — warning resolved

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5   # Node.js 24 — warning resolved
        with:
          python-version: "3.12"

      # ── 3. Python dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install playwright python-dotenv openpyxl pandas

      # ── 4. Playwright browser ──────────────────────────────────────────────
      # Install only Chromium (smaller, faster than full install)
      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      # ── 5. Run the bot ─────────────────────────────────────────────────────
      # Secrets are set in GitHub → Settings → Secrets → Actions
      # HEADLESS=true so Chromium runs without a display on the Linux runner
      - name: Run combined bot
        env:
          HEADLESS: "true"
          IREC_EMAIL:       ${{ secrets.IREC_EMAIL }}
          IREC_PASSWORD:    ${{ secrets.IREC_PASSWORD }}
          TIGR_MYUSERNAME:  ${{ secrets.TIGR_MYUSERNAME }}
          TIGR_MYPASSWORD:  ${{ secrets.TIGR_MYPASSWORD }}
          TIGR_SGUSERNAME:  ${{ secrets.TIGR_SGUSERNAME }}
          TIGR_SGPASSWORD:  ${{ secrets.TIGR_SGPASSWORD }}
        # 'script -q -c' allocates a pseudo-TTY so the bot's input() prompts
        # don't hang; stdout is piped out normally.
        run: |
          echo "=== Bot starting ==="
          # Run with a timeout safety net (30 min max)
          timeout 1800 python combined_bot.py || true
          echo "=== Bot finished ==="

      # ── 6. Upload all outputs as artifacts ────────────────────────────────
      - name: Upload combined Excel output
        if: always()
        uses: actions/upload-artifact@v4   # Node.js 24 — warning resolved
        with:
          name: combined-output-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Upload downloaded source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ github.run_number }}
          path: downloads/
          retention-days: 7

      - name: Upload screenshots (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 14

