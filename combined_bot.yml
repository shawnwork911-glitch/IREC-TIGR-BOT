name: Combined Bot — IREC + TIGR
# 5 AM MYT Tue & Thu (= 21:00 UTC Mon & Wed) — primary
# 7 AM MYT Tue & Thu (= 23:00 UTC Mon & Wed) — backup
on:
  schedule:
    - cron: '0 21 * * 1,3'   # 5 AM MYT Tue & Thu
    - cron: '0 23 * * 1,3'   # 7 AM MYT Tue & Thu
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # kill the job if it hangs beyond 30 min

    steps:

      # ── 1. Check out your repo ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # caches pip downloads between runs (faster)

      # ── 3. Install Python dependencies ──────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install playwright python-dotenv openpyxl pandas msal requests

      # ── 4. Install Playwright's Chromium browser ─────────────────────────────
      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      # ── 5. Create folders the bot expects ───────────────────────────────────
      - name: Create working directories
        run: mkdir -p downloads logs screenshots output

      # ── 6. Write credentials from GitHub Secrets into a .env file ───────────
      #       Never put real passwords directly in this file!
      #       They are stored securely in GitHub → Settings → Secrets.
      - name: Write .env from secrets
        run: |
          cat > .env << 'EOF'
          IREC_EMAIL=${{ secrets.IREC_EMAIL }}
          IREC_PASSWORD=${{ secrets.IREC_PASSWORD }}
          TIGR_MYUSERNAME=${{ secrets.TIGR_MYUSERNAME }}
          TIGR_MYPASSWORD=${{ secrets.TIGR_MYPASSWORD }}
          TIGR_SGUSERNAME=${{ secrets.TIGR_SGUSERNAME }}
          TIGR_SGPASSWORD=${{ secrets.TIGR_SGPASSWORD }}
          HEADLESS=true
          EOF

      # ── 7. Run the bot ───────────────────────────────────────────────────────
      - name: Run combined_bot.py
        run: python combined_bot_ci.py
        # Uses combined_bot_ci.py (the CI-safe version without input() calls)

      # ── 8. Upload output Excel as a downloadable artifact ───────────────────
      #       You can download it from the GitHub Actions run page
      #       It is kept for 30 days by default
      - name: Upload output Excel
        if: always()            # upload even if the bot had partial errors
        uses: actions/upload-artifact@v4
        with:
          name: combined-output-${{ github.run_number }}
          path: |
            output/combined_output.xlsx
            logs/
          retention-days: 30

      # ── 9. Upload screenshots (useful for debugging failures) ────────────────
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 7
